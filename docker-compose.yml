version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: marketlead_db
    environment:
      POSTGRES_USER: marketlead
      POSTGRES_PASSWORD: marketlead_pass
      POSTGRES_DB: marketlead_db
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: marketlead_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: marketlead_queue
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    
